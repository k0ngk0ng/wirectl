name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-14
          - name: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOPATH: ${{ github.workspace }}/.cache/go
      GOTMPDIR: ${{ github.workspace }}/.cache/tmp
      TMPDIR: ${{ github.workspace }}/.cache/tmp
      TEMP: ${{ github.workspace }}/.cache/tmp
      TMP: ${{ github.workspace }}/.cache/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-local Go paths
        shell: bash
        run: mkdir -p "$GOCACHE" "$GOMODCACHE" "$GOPATH" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test native target
        run: go test -race -timeout 2m ./...
      - name: Vet native target
        run: go vet ./...
