name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - run: go test -race ./... && go vet ./...
      - name: Build standalone hosts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=${TAG#v}
          mkdir -p dist
          for TARGET in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            GOOS=${TARGET%-*}
            GOARCH=${TARGET#*-}
            export GOOS GOARCH
            mkdir -p ".cache/$TARGET/bin"
            CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o ".cache/$TARGET/bin/wirectl" ./cmd/wirectl
            cp README.md ".cache/$TARGET/"
            tar -czf "dist/wirectl-$VERSION-$TARGET.tar.gz" -C ".cache/$TARGET" bin README.md
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" --notes 'Standalone wirectl hosts for macOS and Linux. The download distribution also includes this host.'
          gh release edit "$TAG" --draft=false
